name: Release

# Ein Tag wie „v0.2.0“ pushen → signierte APK bauen und als GitHub-Release veröffentlichen.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt – siehe RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease testReleaseUnitTest --console=plain
          cp app/build/outputs/apk/release/app-release.apk "SimpleConverter-${GITHUB_REF_NAME}.apk"
          sha256sum "SimpleConverter-${GITHUB_REF_NAME}.apk" > "SimpleConverter-${GITHUB_REF_NAME}.apk.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SimpleConverter-${{ github.ref_name }}.apk
            SimpleConverter-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
